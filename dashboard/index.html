<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS — Opportunity Radar v0</title>
  <style>
    :root { color-scheme: dark; --bg:#050706; --panel:#0a0e0c; --line:#26312b; --muted:#94a39b; --text:#edf6f0; --signal:#78f0ae; --warn:#ffc861; --danger:#ff7d7d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:linear-gradient(rgba(120,240,174,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,174,.025) 1px,transparent 1px),radial-gradient(circle at 10% 0,#102319 0,var(--bg) 34%); background-size:32px 32px,32px 32px,auto; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    main { width:min(1440px,calc(100% - 32px)); margin:auto; padding:26px 0 48px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .eyebrow,.label { color:var(--signal); font:600 11px/1.4 ui-monospace,monospace; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font:600 clamp(26px,5vw,52px)/1 ui-monospace,monospace; letter-spacing:-.06em; }
    h2 { margin:0; font:600 14px/1.2 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; }
    h3 { margin:0 0 8px; font-size:18px; line-height:1.25; }
    p { color:#cad5cf; line-height:1.55; } a { color:var(--signal); overflow-wrap:anywhere; }
    .mode { padding:8px 11px; border:1px solid var(--signal); color:var(--signal); background:rgba(120,240,174,.06); font:700 12px ui-monospace,monospace; }
    .mode.fixture { color:var(--warn); border-color:var(--warn); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .panel { min-width:0; border:1px solid var(--line); background:rgba(10,14,12,.94); box-shadow:0 18px 60px rgba(0,0,0,.22); }
    .panel-head { display:flex; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
    .panel-body { padding:18px; }
    .meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
    .datum { min-width:0; padding:11px; border:1px solid #1b241f; background:#080b09; }
    .datum strong { display:block; margin-top:5px; font:600 13px/1.45 ui-monospace,monospace; overflow-wrap:anywhere; }
    .links { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; }
    .score-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
    .score { color:var(--signal); font:700 34px/1 ui-monospace,monospace; }
    .bar { height:7px; margin:13px 0 18px; background:#131a16; overflow:hidden; }
    .bar span { display:block; height:100%; background:linear-gradient(90deg,#2d6d4b,var(--signal)); }
    .component { display:grid; grid-template-columns:150px 52px 1fr; gap:9px; padding:8px 0; border-top:1px solid #18201c; }
    code { font-family:ui-monospace,monospace; color:#dce9e2; overflow-wrap:anywhere; }
    small { color:var(--muted); line-height:1.45; }
    .warning { border-left:3px solid var(--warn); background:rgba(255,200,97,.06); padding:10px 12px; color:#f2dfb9; margin-top:15px; }
    .chain { margin:0; padding:0; list-style:none; }
    .chain li { position:relative; padding:0 0 22px 27px; }
    .chain li:not(:last-child)::before { content:''; position:absolute; left:7px; top:16px; bottom:2px; width:1px; background:#365244; }
    .chain li::after { content:''; position:absolute; left:2px; top:4px; width:11px; height:11px; border:1px solid var(--signal); background:var(--bg); }
    .uncertainty { margin:8px 0; padding:10px 12px; border:1px solid #4b4028; color:#f0ddb7; }
    .positions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .position { border:1px solid #1c2721; padding:12px; background:#080b09; } .position.nova { border-color:#4b4028; }
    .status { display:inline-flex; margin-top:14px; padding:7px 10px; font:700 12px ui-monospace,monospace; border:1px solid currentColor; color:var(--signal); }
    .status.human_gate { color:var(--warn); } .status.denied { color:var(--danger); }
    .ledger { margin-top:15px; padding-top:13px; border-top:1px solid var(--line); }
    .error { max-width:700px; margin:80px auto; border:1px solid var(--danger); padding:20px; color:#ffd4d4; background:#1a0c0c; }
    @media(max-width:900px){.grid{grid-template-columns:1fr}.positions{grid-template-columns:1fr}}
    @media(max-width:620px){main{width:calc(100% - 20px)}header{align-items:start;flex-direction:column}.meta{grid-template-columns:1fr}.component{grid-template-columns:1fr 45px}.component small{grid-column:1/-1}}
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">Nexus trust / execution layer</div><h1>OPPORTUNITY RADAR</h1></div><div id="mode" class="mode">LOADING VERIFIED STATE</div></header>
    <div id="app" class="grid" aria-live="polite"></div>
  </main>
  <script>
    const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
    const panel=(number,title)=>{const root=el('section','panel'),head=el('div','panel-head'),body=el('div','panel-body');head.append(el('h2','',title),el('span','label',String(number).padStart(2,'0')));root.append(head,body);return{root,body}};
    const link=(text,href)=>{const n=el('a','',text);try{const u=new URL(href);if(['https:','http:'].includes(u.protocol)){n.href=u.href;n.target='_blank';n.rel='noreferrer'}}catch{}return n};
    const datum=(label,value)=>{const n=el('div','datum');n.append(el('span','label',label),el('strong','',value));return n};
    function reality(state){const p=panel(1,'Reality Delta'),e=state.sourceEvent;p.body.append(el('div','label',state.realityDelta.status),el('h3','',e.document.title),el('p','',e.whatChanged),el('p','',state.realityDelta.statement));const m=el('div','meta');m.append(datum('Published',e.document.publication_date),datum('Retrieved',e.retrievedAt),datum('Source SHA-256',e.source.sha256.slice(0,16)+'…'));p.body.append(m);const links=el('div','links');links.append(link('Federal Register record ↗',e.document.html_url),link('Official GovInfo PDF ↗',e.document.pdf_url));p.body.append(links,el('div','warning',e.sourceCaveat));return p.root}
    function radar(state){const p=panel(2,'Opportunity Radar'),top=state.opportunities[0],row=el('div','score-row');row.append(el('h3','',top.opportunity.title),el('div','score',top.score.toFixed(3)));const bar=el('div','bar'),fill=el('span');fill.style.width=Math.max(0,Math.min(100,top.score*100))+'%';bar.append(fill);p.body.append(row,bar);for(const c of top.components){const n=el('div','component');n.append(el('code','',c.name),el('code','',c.value.toFixed(3)),el('small','',c.rationale));p.body.append(n)}p.body.append(el('div','warning',state.scenarioAssumptions.label+': '+state.scenarioAssumptions.basis.join(' ')));return p.root}
    function evidence(state){const p=panel(3,'Evidence Graph'),chain=el('ol','chain'),observed=state.claims.find(c=>c.classification==='OBSERVED'),top=state.opportunities[0];const stages=[['SOURCE',state.sourceEvent.source.provider+' · '+state.sourceEvent.document.document_number],['CLAIM',observed?observed.text:'No observed claim'],['WAYFINDER',top.opportunity.id+' · rank #'+top.rank],['POLICY / VERIFY',state.action.status+' · '+state.action.ruling.reason]];for(const [label,value] of stages){const n=el('li');n.append(el('div','label',label),el('div','',value));chain.append(n)}const refs=el('div','links');refs.append(link('Claim source ↗',state.sourceEvent.document.html_url),link('Official evidence ↗',state.sourceEvent.document.pdf_url));p.body.append(chain,refs,el('div','label','Contradiction / uncertainty retained'));for(const u of state.uncertainties)p.body.append(el('div','uncertainty',u.kind+' — '+u.statement));return p.root}
    function operations(state){const p=panel(4,'Operations'),positions=el('div','positions'),a=el('div','position'),n=el('div','position nova');a.append(el('div','label','Argus thesis · hypothesis'),el('p','',state.deliberation.thesis.statement));n.append(el('div','label','Nova cross-examination · hypothesis'),el('p','',state.deliberation.crossExamination.statement));positions.append(a,n);const refs=el('div','links');refs.append(link('Deliberation evidence ↗',state.sourceEvent.document.html_url));p.body.append(positions,refs);p.body.append(el('div','status '+state.action.status.toLowerCase(),state.action.status),el('p','',state.action.evidence.reason));const l=el('div','ledger');l.append(el('div','label','Canonical ledger'),el('p','',(state.ledger.verified?'HASH CHAIN VERIFIED':'VERIFICATION FAILED')+' · '+state.ledger.length+' total events'),el('code','',state.ledger.headHash));p.body.append(l);return p.root}
    fetch('/api/radar/latest',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Verified radar state is unavailable.');return r.json()}).then(state=>{if(state.schemaVersion!=='nexus.opportunity-radar.v0')throw new Error('Unsupported radar state.');const mode=document.querySelector('#mode');mode.textContent=state.live?'LIVE · PUBLIC SOURCE':'FIXTURE · REPLAY ONLY';if(!state.live)mode.classList.add('fixture');document.querySelector('#app').append(reality(state),radar(state),evidence(state),operations(state))}).catch(error=>{const app=document.querySelector('#app');app.className='';app.append(el('div','error',error.message))});
  </script>
</body>
</html>
