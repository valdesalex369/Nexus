name: Hive bounded workflow
on:
  push:
    branches: ['codex/hive-bounded-research-v1']
    paths: ['src/nexus/hive_workflow.mjs', 'tests/hive_workflow.test.mjs', '.github/workflows/hive-ci.yml']
  pull_request:
    paths: ['src/nexus/hive_workflow.mjs', 'tests/hive_workflow.test.mjs', '.github/workflows/hive-ci.yml']
permissions:
  contents: read
jobs:
  bounded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/hive_workflow.test.mjs
