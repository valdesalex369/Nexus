name: paper-scout
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/nexus/paper_scout.py
      - name: commit tape
        run: |
          git config user.name orbital-scout
          git config user.email orbital@users.noreply.github.com
          git add data/paper/latest.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "paper scout cycle"
          git push
