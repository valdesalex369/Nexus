name: Operations Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - nova/hackathon-convergence-v0
    paths:
      - 'data/operations/events/**'
      - 'src/operations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/operations-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: operations-snapshot-nova-hackathon-convergence-v0
  cancel-in-progress: true

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova/hackathon-convergence-v0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Compile Operations snapshot
        run: npm run operations:compile

      - name: Commit regenerated snapshot when state changed
        shell: bash
        run: |
          branch='nova/hackathon-convergence-v0'

          sync_latest_and_recompile() {
            git fetch origin "$branch"
            local remote_sha
            remote_sha="$(git rev-parse "origin/$branch")"
            local head_sha
            head_sha="$(git rev-parse HEAD)"
            if [ "$remote_sha" != "$head_sha" ]; then
              echo "Branch advanced during verification; recomputing from latest remote state."
              git reset --hard "origin/$branch"
              npm ci
              npm run typecheck
              npm test
              npm run operations:compile
            fi
          }

          commit_snapshot() {
            if git diff --quiet -- data/operations/compiled.json; then
              echo 'Operations snapshot already current.'
              return 1
            fi

            git config user.name 'nexus-operations-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/operations/compiled.json
            git commit -m 'Refresh compiled Operations snapshot [skip ci]'
          }

          sync_latest_and_recompile
          if ! commit_snapshot; then
            exit 0
          fi

          if git push origin HEAD:"$branch"; then
            exit 0
          fi

          echo 'Push raced with a newer branch update; retrying once from authoritative remote state.'
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          npm ci
          npm run typecheck
          npm test
          npm run operations:compile
          if ! commit_snapshot; then
            exit 0
          fi
          git push origin HEAD:"$branch"
