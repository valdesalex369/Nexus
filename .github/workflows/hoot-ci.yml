name: Hoot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Hoot authorization tests
        run: python -m unittest tests.test_hoot_router -v

      - name: Run Hoot sandbox tests
        run: python -m unittest tests.test_hoot_sandbox -v

      - name: Run Hoot ledger tests
        run: python -m unittest tests.test_hoot_ledger -v

      - name: Run Hoot evaluator gauntlet
        run: python -m unittest tests.test_hoot_evaluator -v

      - name: Run complete unittest discovery
        run: python -m unittest discover -s tests -v
